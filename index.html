 "ref": "工程會全生命週期教材"}, {"day": 11, "q": "下列何者符合採購法對承辦與驗收職務分工的要求？", "opts": ["原採購承辦單位人員不得擔任所辦採購主驗人", "所有人都可以主驗", "廠商自己擔任主驗", "主驗人必須是最低標廠商"], "a": 0, "why": "第71條明定採購承辦單位人員不得擔任所辦採購的主驗人。", "ref": "採購法第71條"}, {"day": 11, "q": "以下哪種招標方式會先公告審查廠商資格？", "opts": ["選擇性招標", "限制性招標", "直接議價", "單純報價"], "a": 0, "why": "選擇性招標先透過公告進行資格審查，之後邀請合格者投標。", "ref": "採購法第18條"}, {"day": 12, "q": "最後複習：以「不實文件」投標，屬於哪一類問題？", "opts": ["採購法第50條所列投標不符情形之一", "允許的價格談判", "驗收後的申請付款", "一般自動合格情形"], "a": 0, "why": "第50條列有以不實文件投標，應依程序處理。", "ref": "採購法第50條"}, {"day": 12, "q": "最後複習：採購法第6條對廠商待遇的原則為何？", "opts": ["只照顧大型廠商", "對廠商不得無正當理由差別待遇", "永遠選本地廠商", "不用考慮公共利益"], "a": 1, "why": "公平合理與不得無正當理由差別待遇，是採購法第6條核心。", "ref": "採購法第6條"}], "sources": {"law": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030057", "rule": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030059", "course": "https://www.pcc.gov.tw/content/index?eid=9868&type=C", "index": "https://www.pcc.gov.tw/content/index?eid=1947&type=C"}};
const N='yuange-procurement-20261108-v1';
let state; try{state=JSON.parse(localStorage.getItem(N))||{}}catch(e){state={}}
if(!state.days)state.days={};if(!state.results)state.results={};if(!state.wrong)state.wrong={};if(!state.notes)state.notes={};
const $=q=>document.querySelector(q);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(N,JSON.stringify(state))}catch(e){alert('此瀏覽器未允許儲存，請使用備份功能或改用電腦瀏覽器。')}}
let sel=Object.create(null),activeQs=[];
function dayIndex(){let x=Number(state.selected);if(Number.isInteger(x)&&x>=0&&x<13)return x;let now=new Date();let key=(now.getMonth()+1)+'/'+now.getDate();let i=D.days.findIndex(x=>x.date.replace(/^0/,'').replace('/0','/')===key);return i>=0?i:now>=new Date('2026-11-08T00:00:00')?12:0}
function dayState(d){return state.days[d]||(state.days[d]=[false,false,false,false])}
function setStep(i){const d=dayIndex();dayState(d)[i]=true;save();render()}
function go(route){let key='#'+route;if(location.hash===key)render();else location.hash=key;}
function nav(){document.querySelectorAll('[data-route]').forEach(b=>{b.classList.toggle('active',(location.hash.slice(1)||'home')===b.dataset.route);b.onclick=()=>go(b.dataset.route)})}
function scrollPageTop(){window.scrollTo(0,0)}
function back(){go('home')}
function daySelect(){return `<select id="chooseDay" aria-label="選擇學習日">${D.days.map((x,i)=>`<option value="${i}" ${i===dayIndex()?'selected':''}>Day ${i+1} · ${x.date} ${esc(x.title)}</option>`).join('')}</select>`}
function attachDay(){if($('#chooseDay'))$('#chooseDay').onchange=e=>{state.selected=Number(e.target.value);save();go('home');render()}}
function home(){let d=dayIndex(),today=D.days[d],ds=dayState(d),n=ds.filter(Boolean).length;let remaining=Math.max(0,Math.ceil((new Date('2026-11-08T00:00:00')-new Date())/86400000));return `<section class="card hero"><div><div class="small">今日只做四件事</div><h1>Day ${d+1}｜${esc(today.title)}</h1><p class="muted">${esc(today.goal)}</p><div class="pills"><span class="pill">學習日 ${today.date}</span><span class="pill">完成 ${n}/4</span></div></div><div style="text-align:center"><div class="count">${remaining}</div><div class="small">天倒數</div></div></section><div class="card"><div class="row"><b>今日任務</b><span class="small">完成 ${n}/4</span></div><div class="meter" style="margin:10px 0"><div style="width:${n*25}%"></div></div><div class="stack">${[['📖','法條速記','今日核心觀念＋易混淆提醒','learn'],['📝','情境練習','5 題原創題，答完看解析','quiz'],['🔁','錯題回補','重新理解做錯的法條','wrong'],['✨','AI 解惑與結束','有疑問就複製提示詞到 ChatGPT','finish']].map((t,i)=>`<button class="task ${ds[i]?'done':''} ${!ds[i] && (i===0 || ds[i-1])?'focus':''}" data-go="${t[3]}"><span class="num">${ds[i]?'✓':i+1}</span><span><b>${t[0]} ${t[1]}</b><span class="note">${t[2]}</span></span><span class="end">${ds[i]?'已完成':'開始 ›'}</span></button>`).join('')}</div></div><div class="card"><div class="row"><b>切換學習日</b>${daySelect()}</div><p class="small">若當天進度未完成，可以回到先前日期補課；每日完成紀錄各自保留。</p></div><div class="card"><div class="row"><b>備考提醒</b><span class="badge">13 天短衝</span></div><p class="muted">先用官方教材與法規建立理解；本系統的題目是自編示範，未連接官方題庫，不能取代同事所屬訓練班的指定範圍。</p></div>`}
function learn(){let d=dayIndex(),x=D.days[d],done=dayState(d)[0];return `<button class="back" onclick="back()">‹ 返回今日任務</button><section class="card"><span class="badge">Day ${d+1} · Step 1</span><h1>${esc(x.title)}</h1><p class="muted">${esc(x.goal)}</p><h2>樹狀重點筆記</h2>${x.notes.map((n,i)=>`<div class="lesson-note"><b>${i+1}｜</b>${esc(n)}</div>`).join('')}<div class="warn">⚠️ 這是精簡導讀，不是法條全文。遇到例外、門檻及期限題，務必再核對原文。</div><p><b>查核依據：</b>${esc(x.ref)}</p><p><a href="${D.sources.law}" target="_blank" rel="noopener">查看政府採購法全文（需網路）</a></p><button class="btn wide" onclick="setStep(0);go('quiz')">${done?'已讀完｜繼續練習':'我已理解重點｜開始練習'} →</button></section>`}
function pool(d,mode){let ids=D.questions.map((q,i)=>i);if(mode==='wrong'){ids=ids.filter(i=>state.wrong[i]);return ids.slice(0,12)}if(mode==='all'){return ids.slice().sort(()=>Math.random()-.5).slice(0,10)}let local=ids.filter(i=>D.questions[i].day===d);let extra=ids.filter(i=>D.questions[i].day!==d).sort((a,b)=>(state.wrong[b]?1:0)-(state.wrong[a]?1:0));return [...local,...extra].slice(0,5)}
function startQuiz(mode='day'){sel=Object.create(null);activeQs=pool(dayIndex(),mode);if(activeQs.length===0){alert('目前尚無錯題，請先完成練習。');return}window.currentQuizMode=mode;go('quizView')}
function quiz(){return `<button class="back" onclick="back()">‹ 返回今日任務</button><section class="card"><span class="badge">Step 2</span><h1>情境選擇題</h1><p class="muted">今天先練 5 題，答完立即看每題解答與法條依據。</p><div class="grid"><button class="btn" onclick="startQuiz('day')">今日五題</button><button class="btn soft" onclick="startQuiz('all')">10 題混合練習</button></div><div class="warn" style="margin-top:13px">注意：皆為自編練習，不是工程會正式公布的試題。答錯要查原條文，避免只是記住答案。</div></section>`}
function quizView(){if(!activeQs.length){return quiz()}let d=dayIndex();return `<button class="back" onclick="go('quiz')">‹ 返回測驗選單</button><section class="card"><span class="badge">${window.currentQuizMode==='day'?'今日五題':window.currentQuizMode==='wrong'?'錯題重練':'混合練習'}</span><h1>立即作答</h1><div class="small">題目作答完成後一次批改；不會直接顯示答案。</div>${activeQs.map((id,j)=>{let q=D.questions[id];return `<article style="border-top:1px solid var(--line);padding-top:14px;margin-top:17px"><div class="qid">第 ${j+1} 題｜${esc(q.ref)}</div><h3>${esc(q.q)}</h3>${q.opts.map((o,k)=>`<button class="option ${sel[id]===k?'selected':''}" data-answer="${id}" data-choice="${k}">${'ABCD'[k]}. ${esc(o)}</button>`).join('')}<div id="feedback-${id}"></div></article>`}).join('')}<button class="btn wide" style="margin-top:18px" onclick="grade()">提交答案｜查看解析</button><div id="score"></div></section>`}
function answerClick(){document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{sel[b.dataset.answer]=Number(b.dataset.choice);document.querySelectorAll(`[data-answer="${b.dataset.answer}"]`).forEach(x=>x.classList.toggle('selected',x.dataset.choice===b.dataset.choice))})}
function grade(){if(activeQs.some(id=>sel[id]===undefined)){alert('請先回答全部題目。');return}let passed=0;for(let id of activeQs){let q=D.questions[id],ok=sel[id]===q.a;if(ok)passed++;else state.wrong[id]=(state.wrong[id]||0)+1;if(ok&&state.wrong[id])delete state.wrong[id];let f=$('#feedback-'+id);f.innerHTML=`<div class="explain ${ok?'success':'warn'}"><b>${ok?'✓ 答對':'✗ 答錯'}｜正解 ${'ABCD'[q.a]}</b><br>${esc(q.why)}<br><span class="small">依據：${esc(q.ref)}</span></div>`;document.querySelectorAll(`[data-answer="${id}"]`).forEach(b=>{b.disabled=true;(Number(b.dataset.choice)===q.a?b.classList.add('correct'):Number(b.dataset.choice)===sel[id]?b.classList.add('incorrect'):null)})}let pct=Math.round(100*passed/activeQs.length);if(window.currentQuizMode==='day'&&pct>=80){dayState(dayIndex())[1]=true}state.results[dayIndex()]={pct,correct:passed,total:activeQs.length};save();$('#score').innerHTML=`<div class="card" style="background:#eff9f2"><h2>本次：${passed}/${activeQs.length}（${pct}%）</h2><p>${pct>=80?'達成本教材設定的 80% 練習門檻。':'未達本教材設定的 80% 練習門檻，建議重練。'}</p><button class="btn" onclick="go('wrong')">前往錯題回補 →</button></div>`;document.querySelectorAll('#app .btn.wide').forEach(b=>{if(b.textContent.includes('提交答案'))b.disabled=true})}
function wrong(){let ids=pool(dayIndex(),'wrong');return `<button class="back" onclick="back()">‹ 返回今日任務</button><section class="card"><span class="badge">Step 3</span><h1>錯題回補</h1>${ids.length?`<p>目前待補強 ${ids.length} 題（最多顯示 12 題）。</p>${ids.map(id=>`<div class="lesson-note"><b>${esc(D.questions[id].q)}</b><p class="small">${esc(D.questions[id].ref)} · ${esc(D.questions[id].why)}</p></div>`).join('')}<button class="btn soft" onclick="startQuiz('wrong')">重新測驗錯題</button>`:`<div class="success">目前沒有未解的錯題。請複述今天的一個法條重點。</div>`}<p class="small">這裡的「錯題」是答錯紀錄；重練答對後會從待補強清單移除。</p><button class="btn wide" onclick="setStep(2);go('finish')">我已回顧｜下一步 →</button></section>`}
function promptText(){let d=dayIndex(),x=D.days[d],wrong=Object.keys(state.wrong).slice(0,4).map(id=>D.questions[id].q).join('；');return `請擔任我的採購專業人員基礎訓練考前家教。考試日期2026/11/8。今天讀到「${x.title}」，參考法規：${x.ref}。${wrong?'我的錯題：'+wrong+'。':''}請用繁體中文提供：①30字核心②費曼白話③樹狀筆記④三個易混淆點⑤一題原創情境題，先等我回答。法規需以最新官方全文核查，若不能查核請標示不確定；勿臆測官方命題機率。`}
function finish(){let x=D.days[dayIndex()];return `<button class="back" onclick="back()">‹ 返回今日任務</button><section class="card"><span class="badge">Step 4</span><h1>AI 解惑與完成</h1><p>主題：<b>${esc(x.title)}</b></p><p class="muted">若還有不懂的法規，把今天的學習情境帶到 ChatGPT。此網頁不會自行呼叫 AI，也不需要 API。</p><div class="lesson-note" style="word-break:break-word">${esc(promptText())}</div><button class="btn soft" onclick="copyPrompt()">複製 AI 家教提問</button><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><button class="btn wide" onclick="setStep(3);go('home')">確認今日已回顧｜完成任務</button></section>`}
async function copyPrompt(){try{await navigator.clipboard.writeText(promptText());alert('已複製，可貼到 ChatGPT 提問。')}catch(e){let t=document.createElement('textarea');t.value=promptText();document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();alert('已嘗試複製；若失敗可手動選取文字。')}}
function practice(){return `<section class="card"><h1>練習工具箱</h1><p class="muted">每天先完成首頁四步驟，再使用額外練習。</p><div class="stack"><button class="task" onclick="startQuiz('all')"><span class="num">10</span><span><b>混合 10 題</b><span class="note">跨章自編練習，適合模擬複習</span></span><span class="end">開始 ›</span></button><button class="task" onclick="startQuiz('wrong')"><span class="num">↺</span><span><b>錯題再練</b><span class="note">答對後移出待回補清單</span></span><span class="end">開始 ›</span></button></div><p class="small">目前題目總數：${D.questions.length} 題。此版本不宣稱符合正式考試全部科目配分與題型。</p></section>`}
function resources(){return `<section class="card"><h1>官方資料與進度備份</h1><p>製作教材時，先將公開法規與官方訓練教材當作第一手來源。</p><div class="stack">${[['工程會基礎訓練教材',D.sources.course],['政府採購法',D.sources.law],['資格考試訓練發證及管理辦法',D.sources.rule],['工程會採購專業人員資訊（含題庫入口）',D.sources.index]].map(x=>`<a class="task" href="${x[1]}" target="_blank" rel="noopener"><span><b>${x[0]}</b><span class="note">需連線開啟官方資料</span></span><span class="end">↗</span></a>`).join('')}</div><h2 style="margin-top:20px">學習進度</h2>${D.days.map((x,i)=>`<div class="day-row ${i===dayIndex()?'current':''}"><span class="small">${x.date}｜${esc(x.title)}</span><b>${(state.days[i]||[]).filter(Boolean).length}/4</b></div>`).join('')}<div class="grid" style="margin-top:15px"><button class="btn" onclick="exportData()">匯出進度 JSON</button><label class="btn soft" style="text-align:center;cursor:pointer">匯入進度<input style="display:none" type="file" accept=".json,application/json" onchange="importData(event)"></label></div><p class="small">本機瀏覽器可能不保證永久保留學習紀錄，建議每天或每兩天匯出備份。跨電腦無法自動同步。</p></section>`}
function exportData(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='源格_採購衝刺進度備份.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
async function importData(e){let file=e.target.files[0];if(!file)return;try{let x=JSON.parse(await file.text());if(!x||typeof x!=='object'||!x.days||!x.results||!x.wrong){throw Error('欄位不符')}if(!confirm('匯入將覆寫目前進度，確定嗎？'))return;state=x;save();go('home')}catch(e){alert('備份檔格式不符：'+e.message)}}
function render(){let r=location.hash.slice(1)||'home';const views={home,learn,quiz,quizView,wrong,finish,practice,resources};$('#app').innerHTML=(views[r]||home)()+`<footer>源格個人學習原型｜題目為自編示範，不能代替官方指定教材／題庫。法規有修正時以官方最新內容為準。</footer>`;nav();attachDay();answerClick();document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));scrollPageTop()}
window.addEventListener('hashchange',render);render();
</script><script>
if ('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')) {
  window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(e){console.warn('離線快取未啟用',e);});});
}
</script></body></html>
