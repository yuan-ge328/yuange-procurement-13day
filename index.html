function catLabel(c){return BANK.categories[c]||'未分類'}

function numericQ(q){return /\d+[,.\d]*(?:萬|億)?元|\d+(?:天|日|年|月|家|人|次|%)|百分之[一二三四五六七八九十百\d]+|[一二三四五六七八九十百千]+(?:天|日|年|月|家|人|次|成)/.test(q[4]+' '+(q[5][Number(q[3])-1]||''))}
function mkRng(seed){return ()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}
function sample(source,n,seed){let arr=source.slice(),rnd=mkRng(seed);for(let i=arr.length-1;i>0;i--){let j=Math.floor(rnd()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr.slice(0,n)}
function targetPool(kind,cat='all',digits=false){let typ=kind==='tf'?0:kind==='choice'?1:null;return BANK.items.map((q,i)=>({q,i})).filter(x=>(typ===null||x.q[1]===typ)&&(cat==='all'||catLabel(x.q[0])===cat)&&(!digits||numericQ(x.q))).map(x=>x.i)}
function picks(kind,n,categories=[],cat='all',digits=false){let base=targetPool(kind,cat,digits);let used=state.v12.counts;let fresh=base.filter(i=>!used[i]),first=fresh.filter(i=>sameCat(BANK.items[i],categories)),second=fresh.filter(i=>!sameCat(BANK.items[i],categories)),old=base.filter(i=>used[i]);let seed=20261108+day()*177+(kind==='choice'?73:kind==='tf'?7:101)+(Object.keys(used).length*31);return [...sample(first,n,seed),...sample(second,n,seed+1),...sample(old,n,seed+2)].slice(0,n)}
function sessionStart(kind,custom=false){let cats=custom?[]:DAILY[day()];let ids=kind==='wrong'?Object.keys(state.v12.wrong).map(Number).filter(i=>BANK.items[i]):picks(kind,kind==='mix'?20:10,cats,custom?filterCat:'all',custom?filterDigits:false);if(kind==='wrong')ids=sample(ids,20,Math.floor(Date.now()/2000));if(!ids.length){alert('此條件沒有可用題目；可以改選其他類型，或先完成今日練習。');return}S={ids,idx:0,kind,correct:0,wrong:[],isDaily:!custom&&kind!=='wrong',day:day(),finished:false};selected=null;reviewed=false;setRoute('question')}
function qkey(q){return catLabel(q[0])+'|'+(q[1]===1?'choice':'tf')+'|'+q[2]}

/* V1.2.3 全題速讀：按原題、題庫答案及相似原題生成學習提示；非經逐條法規核實的正式解析。 */
function briefClause(s,n=78){s=String(s||'').trim();let arr=s.split(/[，。；;：]/).map(t=>t.trim()).filter(Boolean);let tail=arr.length>1?arr.slice(-2).join('；'):s;return (tail.length>n?tail.slice(0,n)+'…':tail)}
function quickNumeric(q){let a=q[1]===1?(q[5][Number(q[3])-1]||''):q[4];let match=a.match(/(?:新臺幣)?[0-9,]+(?:\.[0-9]+)?(?:萬|億)?元|[0-9]+(?:個月|年|月|日|天|家|人|次|％|%)|百分之[零一二三四五六七八九十百千\d]+/);return match?match[0]:''}
function quickExplanation(q){
 const isTF=q[1]===0,stem=String(q[4]||''),ans=String(q[3]||''),num=quickNumeric(q);

 if(!isTF){

  const exclude=/何(?:者|項|種).*?(?:不得|不屬|不包括|不是|不允許|無須|不適當|不需要)|何者非為|何者非屬/.test(stem);
  const all=/^(?:以上皆是|以上皆非|以上均是|以上均非|皆是|皆非)/.test(opt);
  if(all){
   s=`<p><b>這是「全選／全否」判斷：</b>題庫答案是「${E(opt)}」。不能只記選項號碼，須逐項核對其他選項在相同前提下是否成立。</p>`;
  }else if(negative){
   s=`<p><b>這是「找錯誤敘述」題：</b>題庫將第 ${E(ans)} 項列為錯誤說法：「${E(briefClause(opt,92))}」。它<b>不是</b>可直接背誦的正確法規；須再核對錯在何種條件或用語。</p>`;
  }else if(exclude){
   s=`<p><b>這是「找排除／禁止項目」題：</b>題庫將第 ${E(ans)} 項「${E(briefClause(opt,110))}」列為答案。要區分「規定排除這個項目」和「這整句話是錯的」，兩者不能混淆。</p>`;
  }else{
   s=`<p><b>一句話抓重點：</b>本題要求判斷「${E(briefClause(stem,54))}」，題庫選的是「${E(briefClause(opt,110))}」。將題幹的限制條件與這個答案綁在一起記。</p>`;
  }
  if(num&&!negative&&!exclude)s+=`<p>🧠 <b>數字記法：</b>「題幹情境 → <span class="diff">${E(num)}</span>」，回想時先想適用對象，再說數字；不可套用到所有採購。</p>`;
  if(negative&&num)s+=`<p>⚠️ 這是反向題：選項中的「${E(num)}」未必是正確法定數字，<b>請勿單獨背誦</b>。</p>`;
  s+=`<p class="tiny">提示性說明：依題庫答案及題目文字編排，不等於已核實其他選項的完整法律理由。</p>`;
 }else if(ans==='O'){
   s=`<p><b>題庫判定：正確。</b>要記住的不是「O」，而是題幹中的這組關係：「${E(briefClause(stem,110))}」。背誦時同時說出主體、條件及結果。</p>`;
   if(num)s+=`<p>🧠 <b>數字記法：</b>「對象＋條件 → <span class="diff">${E(num)}</span>」。留意題目中是否還有例外或金額基準。</p>`;
 }else{
   s=`<p><b>題庫判定：錯誤。</b>這句敘述至少有一處不符合題庫答案；請先檢查「${E(briefClause(stem,105))}」的用語、門檻或例外，不能將整句當法條背下來。</p>`;
   const pair=(window.YG_PAIRS||{})[String(BANK.items.indexOf(q))];
   if(pair){const cp=BANK.items[pair[0]];s+=`<p><b>🔍 題庫正反對照：</b>同課程是非題第 ${E(cp[2])} 題標為 O。</p>`;
     if(pair[1]&&pair[2])s+=`<p>兩題用語差異：<span class="diff">「${E(pair[1])}」 ↔ 「${E(pair[2])}」</span>。這是優先辨認的差異，仍須確認兩題的適用前提。</p>`;
     else s+=`<p>相近正確題的表述：${E(briefClause(cp[4],135))}。可比對兩題有無省略或增加關鍵詞。</p>`;
   }else if(num)s+=`<p>⚠️ <b>數字陷阱：</b>題幹提到「${E(num)}」，但本題答案是 X；該數字<b>不能直接當成正確門檻</b>，須核對教材。</p>`;
   else s+=`<p>辨題口訣：「見到絕對語，先查例外；看到否定詞，先查適用對象」。此為查證方向，不代表已判定實際錯點。</p>`;
 }
 return `<div class="quick"><b>💡 30 秒速讀解析</b>${s}</div>`;
}

function reviewedExplanation(q){
const key=q[0]+':'+q[1]+':'+q[2],d=(window.YG_EXPLANATIONS||{})[key];
if(!d)return '<p class="tiny">本題目前提供速讀引導；尚未完成逐項法規解析，建議先自我回想，仍不懂再查教材或複製 AI 提問。</p>';
const label=d.status==='draft'?'📚 法規解析｜來源對照稿':'📖 法規解析｜條文重點對照';
const note=d.status==='draft'?'<p class="tiny">⚠ 本題為依題庫答案與授課教材整理的教學解釋，非逐條查證完成的法規意見。如有版本或個案疑義，請以現行法規、函釋為準。</p>':'';
return `<details class="more"><summary>展開完整選項解析與法規線索</summary><div class="lesson"><b>${label}</b><p>${E(d.summary)}</p><b>四個選項逐項解析</b>${(d.reasons||[]).map((x,i)=>`<p style="margin:7px 0"><b>${String.fromCharCode(65+i)}：</b>${E(x)}</p>`).join('')}${d.memory?`<div class="memo"><b>🧠 數字／觀念口訣</b><p>${E(d.memory)}</p></div>`:''}${d.trap?`<p><b>易錯提醒：</b>${E(d.trap)}</p>`:''}${note}<p class="tiny">題目來源：${E(d.source)}<br>法規與教材線索：${E(d.law)}<br>校核狀態：${E(d.verified)}</p><p><a href="${E(d.url)}" target="_blank" rel="noopener noreferrer">開啟相關法規／官方教材來源</a></p></div></details>`}
function question(){if(!S)return `<section class="card"><h1>尚未開始練習</h1><button class="btn" data-act="route" data-kind="practice">選擇練習</button></section>`;const id=S.ids[S.idx],q=BANK.items[id],tf=q[1]===0,items=tf?['正確 O','錯誤 X']:q[5],choice=tf?selected===0?'O':'X':selected===null?null:String(selected+1),isRight=reviewed&&(choice===q[3]);const count=S.idx+1;return `<button class="back" data-act="route" data-kind="${S.isDaily?'home':'practice'}">‹ 返回</button><section class="card"><div class="row"><span class="badge">${S.kind==='tf'?'是非題':S.kind==='choice'?'選擇題':S.kind==='wrong'?'錯題重練':'混合練習'}</span><span class="sub">第 ${count}／${S.ids.length} 題</span></div><div class="meter" style="margin:12px 0"><div style="width:${100*count/S.ids.length}%"></div></div><div class="tiny">${E(catLabel(q[0]))}｜原題 ${q[2]}｜PDF 第 ${q[6]} 頁</div><h2 style="margin-top:17px">${E(q[4])}</h2>${items.map((o,i)=>`<button ${reviewed?'disabled':''} class="option ${selected===i?'selected':''} ${reviewed&&((tf?(i===0?'O':'X'):String(i+1))===q[3])?'good':''} ${reviewed&&selected===i&&!isRight?'bad':''}" data-option="${i}">${tf?'':String.fromCharCode(65+i)+'．'}${E(o)}</button>`).join('')}${reviewed?`<div class="explain"><b>${isRight?'✓ 答對':'✕ 答錯'}｜題庫標準答案：${E(answer(q))}</b><p>先看下方 30 秒速讀提示；仍不懂再展開逐項解析或複製 AI 提問。速讀提示不是官方法規解析。</p><div class="tiny">建議對照：${E(catLabel(q[0]))} 課程教材${q[7]?'｜題庫法源：'+E(q[7]):''}</div>${quickExplanation(q)}${reviewedExplanation(q)}${!((window.YG_EXPLANATIONS||{})[q[0]+':'+q[1]+':'+q[2]])?numericMemo(q):''}<button class="btn soft" data-act="copyPrompt">複製本題 AI 家教提問</button></div><button class="btn wide" data-act="next">${count===S.ids.length?'查看本次成績':'下一題 →'}</button>`:`<button class="btn wide" data-act="check" ${selected===null?'disabled':''}>確認答案 →</button><p class="tiny">答題前不顯示標準答案；答錯才加入錯題庫。</p>`}</section>`}
function check(){if(!S||selected===null||reviewed)return;const id=S.ids[S.idx],q=BANK.items[id],user=q[1]===0?(selected===0?'O':'X'):String(selected+1);let isRight=user===q[3];if(isRight){S.correct++;delete state.v12.wrong[id]}else{S.wrong.push(id);state.v12.wrong[id]=(state.v12.wrong[id]||0)+1}state.v12.counts[id]=(state.v12.counts[id]||0)+1;reviewed=true;save();render()}
function next(){if(!S||!reviewed)return;S.idx++;selected=null;reviewed=false;if(S.idx>=S.ids.length){let pct=Math.round(100*S.correct/S.ids.length);S.finished=true;state.v12.results.push({date:new Date().toISOString(),day:S.day,kind:S.kind,n:S.ids.length,correct:S.correct,pct});if(state.v12.results.length>150)state.v12.results=state.v12.results.slice(-150);if(S.isDaily&&pct>=80){if(S.kind==='tf')doneFor(S.day)[1]=true;if(S.kind==='choice')doneFor(S.day)[2]=true}save();setRoute('score')}else render()}
function score(){if(!S)return home();let pct=Math.round(100*S.correct/S.ids.length);return `<section class="card"><span class="badge">本次練習完成</span><h1>${S.correct}／${S.ids.length}（${pct}%）</h1><p>${pct>=80?'達到本系統設定的 80% 練習門檻。':'未達 80%，建議回看錯題並再練一輪。'}</p><div class="row"><span class="sub">新產生錯題 ${S.wrong.length} 題</span><span class="sub">累積待回補 ${Object.keys(state.v12.wrong).length} 題</span></div><button class="btn wide" data-act="route" data-kind="home">返回今日任務</button><button class="btn soft wide" data-act="route" data-kind="wrong">錯題回補</button></section>`}
function wrong(){let ids=Object.keys(state.v12.wrong).map(Number).filter(i=>BANK.items[i]);return `<button class="back" data-act="route" data-kind="home">‹ 回今日任務</button><section class="card"><span class="badge">今日 Step 4</span><h1>錯題＋數字回補</h1><p class="sub">待回補 ${ids.length} 題，答對後從錯題清單移除。建議優先複習數字期限題。</p><div class="grid"><button class="btn soft" data-act="start" data-kind="wrong">錯題重練</button><button class="btn soft" data-act="route" data-kind="number">數字記憶室</button></div>${ids.length?ids.slice(0,6).map(i=>{let q=BANK.items[i];return `<div class="listitem"><b>${E(q[4].slice(0,75))}${q[4].length>75?'…':''}</b><div class="tiny">${E(catLabel(q[0]))}｜PDF 第 ${q[6]} 頁</div></div>`}).join(''):'<div class="lesson">目前沒有待回補錯題。可去數字記憶室練習。</div>'}<button class="btn wide" data-act="finish">今天已完成錯題／數字複習</button></section>`}
function number(){let ids=BANK.items.map((q,i)=>numericQ(q)?i:-1).filter(i=>i>=0),count=ids.length;return `<button class="back" data-act="route" data-kind="wrong">‹ 回錯題回補</button><section class="card"><span class="badge">考前數字速記</span><h1>數字記憶室</h1><p>題庫中辨識到約 ${count.toLocaleString()} 題涉及金額、家數、期限或比例。已為部分題目編寫有情境限制的口訣；其餘使用「對象→條件→數字」提示。</p><div class="warn">口訣以題庫答案為依據，但不是法規全文。尤其是非題標示「錯」時，不能把題幹數字當標準規定。</div><div class="grid"><button class="btn" data-act="startNumeric" data-kind="choice">練選擇題 10 題</button><button class="btn soft" data-act="startNumeric" data-kind="tf">練是非題 10 題</button></div><h2 style="margin-top:20px">示範口訣</h2>${Object.values(MNEMO).slice(0,5).map(m=>`<div class="memo"><b>${E(m.phrase)}</b><div class="sub">${E(m.fact)}</div><div class="tiny">提醒：${E(m.trap)}</div></div>`).join('')}</section>`}
function startReviewed100(){
 const pool=BANK.items.map((q,i)=>q[0]===11&&q[1]===1&&q[2]>=1&&q[2]<=100?i:-1).filter(i=>i>=0);
 pool.sort((a,b)=>(state.v12.counts[a]||0)-(state.v12.counts[b]||0)||a-b);
 if(!pool.length){alert('本次解析專題題庫未載入');return}
 S={ids:pool.slice(0,10),idx:0,kind:'choice',correct:0,wrong:[],isDaily:false,day:day(),finished:false};selected=null;reviewed=false;setRoute('question');
}
function practice(){let wrong=Object.keys(state.v12.wrong).length;return `<section class="card"><h1>練習工具箱</h1><p class="sub">每題答完先看 30 秒速讀提示；仍不懂再看詳細解析或用 AI 家教。題庫按原課程分類，預設優先抽未練題。</p><div class="grid"><button class="tile" data-act="start" data-kind="tf"><b>是非速練</b><small>10 題</small></button><button class="tile" data-act="start" data-kind="choice"><b>選擇速練</b><small>10 題</small></button><button class="tile" data-act="start" data-kind="mix"><b>混合練習</b><small>20 題</small></button><button class="tile" data-act="route" data-kind="number"><b>數字記憶</b><small>金額、比例、期限</small></button></div><div class="lesson"><b>📖 法規選擇題解析 100 題</b><p class="sub">《全部題庫》「政府採購法之總則、招標及決標」第 1～100 題，每次練 10 題，優先安排未練題；依題庫答案逐項說明，部分題目標示待進一步法規核實。</p><p class="tiny">已練習 ${BANK.items.map((q,i)=>q[0]===11&&q[1]===1&&q[2]>=1&&q[2]<=100&&(state.v12.counts[i]||0)>0?1:0).reduce((a,b)=>a+b,0)} / 100 題</p><button class="btn wide" data-act="reviewed100">開始解析精練 10 題 →</button></div><h3>自訂範圍</h3><select id="filterCat" style="width:100%"><option value="all">全部課程</option>${BANK.categories.map(c=>`<option value="${E(c)}" ${filterCat===c?'selected':''}>${E(c)}</option>`).join('')}</select><label style="display:flex;align-items:center;gap:8px;margin:12px 0"><input id="filterDigits" type="checkbox" ${filterDigits?'checked':''}>只練數字題</label><button class="btn soft wide" data-act="startCustom">依篩選條件練 10 題</button><p class="sub">待回補 ${wrong} 題</p><button class="btn ghost wide" data-act="start" data-kind="wrong">錯題重練</button></section>`}
function resources(){let oldDone=Object.values(state.days).filter(Array.isArray).flat().filter(Boolean).length;return `<section class="card"><h1>資料來源與進度備份</h1><p>本版以《全部題庫.pdf》（115/10/27）作為單一題庫來源，保留原題及答案。所有題目均有依題庫答案生成的速讀提示；105 題另有較深入解析，並非每題都已完成教材或法規核對。</p><div class="grid"><div class="tile"><b>${BANK.items.length.toLocaleString()}</b><small>去重後題數</small></div><div class="tile"><b>${Object.keys(state.v12.wrong).length}</b><small>待回補題數</small></div></div><h3>原有 V1.1 紀錄</h3><div class="sub">既有紀錄仍保留（舊版勾選項數 ${oldDone}）。V1.2 每日四步驟另行計算，不把舊版的自編題分數當新題庫成績。</div><h3>備份與還原</h3><div class="grid"><button class="btn" data-act="export">匯出 JSON 備份</button><label class="btn soft" style="text-align:center;cursor:pointer">匯入 JSON<input id="importFile" type="file" accept="application/json,.json" style="display:none"></label></div><div class="warn"><b>換版前請先備份：</b>iPhone Safari／主畫面 App 不一定共用進度，請在同事實際使用的主畫面版本操作匯出。</div><h3>官方來源</h3><p><a href="https://www.pcc.gov.tw/content/index?eid=9868&type=C" target="_blank" rel="noopener">工程會：採購專業人員基礎訓練教材</a></p><p><a href="https://www.pcc.gov.tw/content/index?eid=1947&type=C" target="_blank" rel="noopener">工程會：採購專業人員相關資訊及題庫入口</a></p><p><a href="https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030057" target="_blank" rel="noopener">全國法規資料庫：政府採購法</a></p><h3>使用說明</h3><p class="sub">題庫為政府公開資料；本網站由源格重編，非工程會官方教材或官方認證產品。原始題庫答案、PDF 文字擷取或適用法規如有疑義，請回到官方 PDF 與現行規定核對。</p></section>`}
function promptFor(q){return `請擔任政府採購專業人員基礎訓練家教。我在源格系統複習《全部題庫.pdf》（115/10/27），課程：${catLabel(q[0])}，題號：${q[2]}，PDF 第 ${q[6]} 頁。題目：${q[4]}。${q[1]===1?'選項：'+q[5].map((o,i)=>'('+ (i+1)+')'+o).join('；'):'本題為是非題。'}原題庫答案：${answer(q)}。請先核對相關現行法規及我所提供的課程教材（若未收到不得假裝閱讀過），再用費曼法說明答案與錯誤選項；遇金額、期限、家數、年度或比例，提供「情境＋數字」口訣及反例。請區分題庫答案、已核實法源、AI 推論；不確定就明說。`}
async function copyPrompt(){if(!S)return;const text=promptFor(BANK.items[S.ids[S.idx]]);try{await navigator.clipboard.writeText(text);alert('已複製題目，可貼到 ChatGPT 追問。')}catch(e){let t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();alert('已嘗試複製；若失敗可改用長按選取。')}}
function exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='源格採購衝刺V12_進度備份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
async function importBackup(file){if(!file)return;try{const x=JSON.parse(await file.text());if(!x||typeof x!=='object'||!x.days||!x.results||!x.wrong)throw Error('備份欄位缺漏');if(!confirm('匯入會覆寫目前的學習進度，請確認已備份。是否繼續？'))return;state=x;if(!state.v12)state.v12={days:{},wrong:{},counts:{},results:[]};save();setRoute('home')}catch(e){alert('無法讀取備份：'+e.message)}}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-route]');if(nav)return setRoute(nav.dataset.route);let b=e.target.closest('[data-option]');if(b){if(!reviewed){selected=Number(b.dataset.option);render()}return}let a=e.target.closest('[data-act]');if(!a)return;let ac=a.dataset.act,k=a.dataset.kind;if(ac==='route')return setRoute(k);if(ac==='lesson')return setRoute('lesson');if(ac==='stepLesson'){doneFor(day())[0]=true;save();return sessionStart('tf')}if(ac==='startDaily')return sessionStart(k);if(ac==='start')return sessionStart(k,true);if(ac==='pickDay'){state.selected=Number(k);save();return setRoute('lesson')}if(ac==='check')return check();if(ac==='next')return next();if(ac==='finish'){doneFor(day())[3]=true;save();return setRoute('home')}if(ac==='copyPrompt')return copyPrompt();if(ac==='startNumeric'){filterDigits=true;filterCat='all';return sessionStart(k,true)}if(ac==='startCustom')return sessionStart('mix',true);if(ac==='reviewed100')return startReviewed100();if(ac==='export')return exportBackup()});
document.addEventListener('change',e=>{if(e.target.id==='chooseDay'){state.selected=Number(e.target.value);save();render()}if(e.target.id==='filterCat')filterCat=e.target.value;if(e.target.id==='filterDigits')filterDigits=e.target.checked;if(e.target.id==='importFile')importBackup(e.target.files[0])});
window.addEventListener('hashchange',render);
if(!BANK||!Array.isArray(BANK.items)){document.getElementById('app').innerHTML='<section class="card"><h1>題庫檔案尚未載入</h1><p>請確認 questions.js、days.js、mnemonics.js 與 index.html 都已上傳至同一資料夾。</p></section>'}else render();
if('serviceWorker'in navigator && (location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));}
</script></body></html>
